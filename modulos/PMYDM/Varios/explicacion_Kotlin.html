  <!-- Google Fonts: Inter y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../script/explicacion_Kotlin-1.js"></script>
  <link rel="stylesheet" href="../../../css/explicacion_Kotlin.css" />

<body class="min-h-screen bg-lightBg text-lightText dark:bg-ideBg dark:text-ideText font-sans antialiased transition-colors duration-300 flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden selection:bg-kotlin/30">

  <!-- Fondos decorativos sutiles idénticos a teoria-kotlin.html -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-28 -left-28 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-kotlin/15 blur-3xl"></div>
    <div class="absolute -bottom-28 -right-28 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-android/10 blur-3xl"></div>
  </div>

  <!-- Botón flotante de cambio de tema (Oscuro / Claro) -->
  <button
    id="theme-toggle"
    type="button"
    onclick="toggleTheme()"
    aria-label="Cambiar entre modo oscuro y modo claro"
    class="fixed top-4 right-4 sm:top-6 sm:right-6 z-20 inline-flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-lightPanel2/90 dark:bg-idePanel2/90 backdrop-blur-md border border-lightBorder dark:border-ideBorder hover:border-kotlin dark:hover:border-kotlin text-xs sm:text-sm font-semibold text-lightText dark:text-ideText shadow-sm transition-all duration-200 active:scale-95"
  >
    <!-- Icono Sol (visible en modo oscuro) -->
    <svg class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <!-- Icono Luna (visible en modo claro) -->
    <svg class="w-4 h-4 block dark:hidden text-kotlin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span class="hidden dark:inline">Modo claro</span>
    <span class="inline dark:hidden">Modo oscuro</span>
  </button>

  <!-- Tarjeta principal centrada -->
  <main class="relative z-10 w-full max-w-lg">
    <section
      class="card-hero-gradient rounded-3xl bg-lightCard dark:bg-ideCard border border-lightBorder dark:border-ideBorder shadow-xl dark:shadow-2xl dark:shadow-black/50 p-6 sm:p-10 text-center transition-colors duration-300"
    >

      <!-- Insignias superiores Android / Kotlin -->
      <div class="flex items-center justify-center gap-2 mb-6">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-android/15 text-emerald-700 dark:text-android border border-android/30">
          <span class="w-1.5 h-1.5 rounded-full bg-android"></span>
          Android Studio
        </span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold bg-kotlin/15 text-kotlin dark:text-[#a485ff] border border-kotlin/30">
          <svg class="w-3 h-3" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="kt-badge-g" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0%" stop-color="#7F52FF"/>
                <stop offset="50%" stop-color="#C711E1"/>
                <stop offset="100%" stop-color="#F88909"/>
              </linearGradient>
            </defs>
            <polygon fill="url(#kt-badge-g)" points="2,2 22,2 12,12 22,22 2,22"/>
          </svg>
          Kotlin · Material 3
        </span>
      </div>

      <!-- Icono SVG de Android (Bugdroid) -->
      <div class="mx-auto w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-lightCard/90 dark:bg-ideCard/90 border border-lightBorder dark:border-ideBorder flex items-center justify-center shadow-lg shadow-kotlin/15 mb-6 animate-floatSlow">
        <svg class="w-12 h-12 sm:w-14 sm:h-14 text-android" viewBox="0 0 48 48" fill="currentColor" aria-label="Icono de Android">
          <path d="M35.2 18.96l3.68-6.36a1.1 1.1 0 0 0-.4-1.5 1.1 1.1 0 0 0-1.5.4l-3.74 6.48a22.9 22.9 0 0 0-18.48 0l-3.74-6.48a1.1 1.1 0 0 0-1.5-.4 1.1 1.1 0 0 0-.4 1.5l3.68 6.36C8.16 21.88 5 26.6 5 32h38c0-5.4-3.16-10.12-7.8-13.04zM17 27.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm14 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
          <rect x="12" y="34.5" width="24" height="3.5" rx="1.75" opacity="0.45"/>
        </svg>
      </div>

      <!-- Título y subtítulo con los degradados de teoria-kotlin.html -->
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-lightText dark:text-ideText">
        Apuntes <span class="bg-gradient-to-r from-[#7F52FF] via-[#C711E1] to-[#F88909] bg-clip-text text-transparent">Kotlin</span>
        <span class="text-android">·</span>
        <span class="bg-gradient-to-r from-[#3DDC84] to-[#4285F4] bg-clip-text text-transparent">PMYDM</span>
      </h1>
      <p class="mt-2 text-sm sm:text-base font-medium text-lightMuted dark:text-ideMuted">
        Temas 3 al 7 · Kotlin, Android y Jetpack Compose
      </p>

      <!-- Botón principal con el degradado oficial de Kotlin usado en teoria-kotlin.html -->
      <div class="mt-8">
        <a
          href="../Temas-PMYDM/teoria-kotlin.html"
          class="btn-kotlin-gradient group w-full inline-flex items-center justify-center gap-2.5 px-6 py-4 rounded-2xl text-white font-bold text-sm sm:text-base hover:brightness-110 transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0"
        >

          <svg class="w-5 h-5 transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </div>
