  <script>
  (function () {
    "use strict";

    const ICON_PSP = `<svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><line x1="9" y1="2" x2="9" y2="5"/><line x1="15" y1="2" x2="15" y2="5"/><line x1="9" y1="19" x2="9" y2="22"/><line x1="15" y1="19" x2="15" y2="22"/><line x1="19" y1="9" x2="22" y2="9"/><line x1="19" y1="15" x2="22" y2="15"/><line x1="2" y1="9" x2="5" y2="9"/><line x1="2" y1="15" x2="5" y2="15"/></svg>`;
    const ICON_SEM = `<svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.7" fill="#ef4444" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="#fbbf24" stroke="none"/><circle cx="12" cy="17" r="1.7" fill="#3DDC84" stroke="none"/></svg>`;
    const ICON_JAVA = `<svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="#3DDC84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`;
    const ICON_TASKS = `<svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
    const COPY_ICON = `<svg class="ic-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

    const SVG = {
      psp: ICON_PSP,
      sem: ICON_SEM,
      java: ICON_JAVA,
      tasks: ICON_TASKS
    };

    function codeBlock(fileName, codeHtml) {
      return `<div class="code" data-lang="java"><div class="code-head"><div class="code-title"><span class="code-dots"><i></i><i></i><i></i></span>${ICON_PSP}<span class="code-file">${fileName}</span><span class="code-lang-pill">JAVA</span></div><button class="copy" type="button">${COPY_ICON}<span>Copiar</span></button></div><pre><code>${codeHtml}</code></pre></div>`;
    }

    function callout(bodyHtml, type = "nota", icon = ICON_SEM) {
      return `<div class="callout ${type}"><div class="callout-ic">${icon}</div><div class="callout-body">${bodyHtml}</div></div>`;
    }

    window.TEMAS = [
      {
        id: "bloque1",
        numero: 1,
        titulo: "Introducción y Clase Semaphore",
        resumen: "Origen de los semáforos de Dijkstra, semáforos binarios y generales, funcionamiento de java.util.concurrent.Semaphore, justicia (fairness) y tabla completa de métodos.",
        badge: "Fundamentos",
        tech: "kotlin",
        icon: "sem",
        secciones: [
          {
            id: "b1-s1",
            titulo: "1.1. Introducción, Definición y Tipos",
            codes: 0,
            tables: 1,
            subs: [
              { id: "origen-semaforos", titulo: "Origen y propósito" },
              { id: "definicion-tipos", titulo: "Definición y Tipos" },
              { id: "estructura-operaciones", titulo: "Estructura y operaciones atómicas" }
            ],
            html: `
              <h3 id="origen-semaforos"><span class="h3-dot"></span><span>Origen y propósito</span></h3>
              <p>El concepto de <strong>semáforos</strong> fue el primero en solucionar problemas de sincronización <strong>sin espera activa</strong>. Fue inventado por <strong>Edsger W. Dijkstra</strong> a finales de la década de 1960 e inspirado en las señales visuales ferroviarias que indican si un tren está habilitado para entrar en una vía.</p>
              <p>Es una construcción sencilla y eficiente implementada habitualmente como servicio del núcleo del sistema operativo, con capacidad de <strong>bloquear y planificar procesos e hilos</strong> condicionados únicamente por el valor de una variable entera.</p>

              <h3 id="definicion-tipos"><span class="h3-dot"></span><span>Definición y Tipos</span></h3>
              <p>Un semáforo es una estructura de datos cuyos valores asociados son enteros positivos (en los <strong>semáforos generales</strong>, de <code>0..N</code>) o las constantes <code>0</code> y <code>1</code> (en el <strong>semáforo binario</strong>).</p>
              <ul>
                <li>El valor <code>0</code> indica que el semáforo está <strong>cerrado (en rojo)</strong>.</li>
                <li>Cualquier valor positivo indica que está <strong>abierto (en verde)</strong>, representando el número exacto de procesos que pueden pasar.</li>
                <li>Estos valores se modifican exclusivamente mediante <strong>operaciones atómicas</strong>.</li>
              </ul>

              <h3 id="estructura-operaciones"><span class="h3-dot"></span><span>Estructura y operaciones atómicas</span></h3>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Elemento</th>
                      <th>Componente / Operación</th>
                      <th>Descripción y Comportamiento</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><strong>Estructura de datos</strong></td>
                      <td><code>contador</code></td>
                      <td><code>0-1</code> → Semáforo binario (Mutex).<br><code>0..N</code> → Semáforo general.</td>
                    </tr>
                    <tr>
                      <td><strong>Operaciones atómicas</strong></td>
                      <td><code>adquirir()</code> / <code>liberar()</code></td>
                      <td>Intentamos adquirir un permiso del semáforo o liberamos y devolvemos un permiso al semáforo.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              ${callout("Al ser operaciones <strong>atómicas</strong>, el sistema operativo o la JVM garantizan que dos hilos no pueden consultar y modificar el contador de forma simultánea produciendo condiciones de carrera.")}
            `
          },
          {
            id: "b1-s2",
            titulo: "1.2. La Clase java.util.concurrent.Semaphore",
            codes: 1,
            tables: 1,
            subs: [
              { id: "clase-semaphore", titulo: "Funcionamiento en Java" },
              { id: "justicia-fairness", titulo: "Constructores y Justicia (Fairness)" },
              { id: "tabla-metodos-semaphore", titulo: "Constructores y Métodos de Semaphore" }
            ],
            html: `
              <h3 id="clase-semaphore"><span class="h3-dot"></span><span>Funcionamiento en Java</span></h3>
              <p>En Java los semáforos se representan como objetos de la clase <code>java.util.concurrent.Semaphore</code>. Gestionan un contador interno que:</p>
              <ul>
                <li>Se <strong>decrementa</strong> en cada llamada a <code>acquire()</code>.</li>
                <li>Se <strong>incrementa</strong> en cada llamada a <code>release()</code>.</li>
                <li>El contador <strong>nunca puede bajar de cero</strong>: si una llamada a <code>acquire()</code> encuentra el contador a cero, bloquea la ejecución del hilo en curso hasta que otro hilo llame a <code>release()</code>.</li>
              </ul>
              ${callout("<strong>Nota sobre permisos dinámicos:</strong> Si se instancia un semáforo con <code>0</code> permisos (<code>new Semaphore(0)</code>) y se invoca <code>semaphore.release(10)</code>, el semáforo pasa a tener <code>10</code> permisos disponibles.", "nota", ICON_PSP)}

              ${codeBlock("PermisosDinamicos.java", `<span class="k">import</span> java.util.concurrent.<span class="t">Semaphore</span>;

<span class="t">Semaphore</span> semaphore = <span class="k">new</span> <span class="t">Semaphore</span>(<span class="n">0</span>); <span class="c">// Empieza cerrado (0 permisos)</span>
semaphore.<span class="f">release</span>(<span class="n">10</span>);                 <span class="c">// Ahora dispone de 10 permisos</span>`)}

              <h3 id="justicia-fairness"><span class="h3-dot"></span><span>Constructores y Justicia (Fairness)</span></h3>
              <p>En el constructor se puede configurar la <strong>justicia o imparcialidad (<em>fairness</em>)</strong> del semáforo:</p>
              <ul>
                <li><strong>Si es justo (<code>fair = true</code>)</strong>: los hilos se desbloquean en estricto orden de llegada (<strong>cola FIFO</strong>).</li>
                <li><strong>Si no es justo (<code>fair = false</code>)</strong>: se desbloquean de forma aleatoria.</li>
              </ul>
              <p>Por defecto <strong>no son justos</strong> porque resulta más eficiente y en usos normales no plantea problemas de inanición (<em>starvation</em>).</p>

              <h3 id="tabla-metodos-semaphore"><span class="h3-dot"></span><span>Constructores y Métodos de Semaphore</span></h3>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Constructor / Método</th>
                      <th>Función y Excepciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><code>Semaphore(int permits)</code></td>
                      <td>Crea un <code>Semaphore</code> con el número dado de permisos (no justo por defecto).</td>
                    </tr>
                    <tr>
                      <td><code>Semaphore(int permits, boolean fair)</code></td>
                      <td>Crea un <code>Semaphore</code> con el número dado de permisos y la configuración de justicia/imparcialidad (FIFO si es <code>true</code>).</td>
                    </tr>
                    <tr>
                      <td><code>void acquire()</code></td>
                      <td>Adquiere un permiso del semáforo o se bloquea si no hay disponibles. Puede lanzar <code>InterruptedException</code>.</td>
                    </tr>
                    <tr>
                      <td><code>void acquire(int permits)</code></td>
                      <td>Adquiere varios permisos según <code>permits</code>, bloqueándose si no hay suficientes. Lanza <code>InterruptedException</code>.</td>
                    </tr>
                    <tr>
                      <td><code>int availablePermits()</code></td>
                      <td>Devuelve el número actual de permisos disponibles en el semáforo.</td>
                    </tr>
                    <tr>
                      <td><code>int getQueueLength()</code></td>
                      <td>Devuelve una estimación del número de hilos que están esperando adquirir un permiso.</td>
                    </tr>
                    <tr>
                      <td><code>boolean tryAcquire()</code></td>
                      <td>Adquiere un permiso solo si está disponible en el momento de la invocación (devuelve <code>true</code> y decrementa, o devuelve <code>false</code> inmediatamente sin bloquearse).</td>
                    </tr>
                    <tr>
                      <td><code>void release()</code></td>
                      <td>Libera un permiso y lo devuelve al semáforo (incrementa el contador).</td>
                    </tr>
                    <tr>
                      <td><code>void release(int permits)</code></td>
                      <td>Libera el número dado de permisos y los devuelve al semáforo.</td>
                    </tr>
                    <tr>
                      <td><code>String toString()</code></td>
                      <td>Devuelve una cadena que identifica el semáforo así como su estado actual.</td>
                    </tr>

              <p>En esta implementación del problema clásico <strong>Productor-Consumidor</strong>, el buffer compartido se construye mediante una estructura <code>Queue&lt;String&gt;</code> (implementada con <code>LinkedList</code>). Las colas son listas con política <strong>FIFO (First Input First Output)</strong> donde los elementos se insertan por el final y se extraen por el frente.</p>

              <h3 id="metodos-queue"><span class="h3-dot"></span><span>Métodos de la interfaz Queue</span></h3>
              <div class="table-wrap">

                    </tr>
                    <tr>
                      <td><code>boolean offer(E e)</code></td>
                      <td>Inserta el elemento especificado en la cola. Devuelve <code>true</code> si tuvo éxito y <code>false</code> en caso contrario. <strong>(Preferible)</strong>.</td>

                    <tr>
                      <td><code>E poll()</code></td>
                      <td>Recupera y elimina el elemento en el frente de la cola, o devuelve <code>null</code> si la cola está vacía. <strong>(Preferible)</strong>.</td>
                    </tr>
                    <tr>
                      <td><code>E remove()</code></td>

<span class="k">import</span> java.util.<span class="t">Queue</span>;
<span class="k">import</span> java.util.concurrent.<span class="t">Semaphore</span>;

<span class="k">public class</span> <span class="t">Buffer</span> {
    <span class="k">static</span> <span class="t">Queue</span>&lt;<span class="t">String</span>&gt; cola = <span class="k">new</span> <span class="t">LinkedList</span>&lt;<span class="t">String</span>&gt;();

    <span class="k">public static void</span> <span class="f">mostrarCola</span>() {
        <span class="t">String</span>[] arr = cola.<span class="f">toArray</span>(<span class="k">new</span> <span class="t">String</span>[cola.<span class="f">size</span>()]);
        <span class="k">for</span> (<span class="k">int</span> i = arr.length - <span class="n">1</span>; i &gt;= <span class="n">0</span>; i--) {
            <span class="t">System</span>.out.<span class="f">print</span>(<span class="s">"| "</span> + arr[i] + <span class="s">" "</span>);
        }
        <span class="t">System</span>.out.<span class="f">println</span>(<span class="s">"\\n----------------------------------\\n"</span>);
    }
}`)}

              <h3 id="clase-productor"><span class="h3-dot"></span><span>Clase Productor</span></h3>
              ${codeBlock("Productor.java", `<span class="k">public class</span> <span class="t">Productor</span> <span class="k">extends</span> <span class="t">Thread</span> {
    <span class="t">String</span> name;
    <span class="t">Semaphore</span> vacio, lleno, mutex;

    <span class="k">public</span> <span class="f">Productor</span>(<span class="t">String</span> name, <span class="t">Semaphore</span> vacio, <span class="t">Semaphore</span> lleno, <span class="t">Semaphore</span> mutex) {
        <span class="k">this</span>.name = name;
        <span class="k">this</span>.vacio = vacio;
        <span class="k">this</span>.lleno = lleno;
        <span class="k">this</span>.mutex = mutex;
    }

    <span class="a">@Override</span>
    <span class="k">public void</span> <span class="f">run</span>() {
        <span class="k">for</span> (<span class="k">int</span> i = <span class="n">0</span>; i &lt; <span class="n">5</span>; i++) {
            <span class="k">try</span> {
                lleno.<span class="f">acquire</span>();  <span class="c">// Toma permiso de hueco disponible (inicialmente 5)</span>
                mutex.<span class="f">acquire</span>();  <span class="c">// Entra en sección crítica</span>
            } <span class="k">catch</span> (<span class="t">InterruptedException</span> e) { e.<span class="f">printStackTrace</span>(); }

            <span class="t">String</span> produce = name + <span class="s">"-"</span> + i;
            <span class="t">Buffer</span>.cola.<span class="f">offer</span>(produce);
            <span class="t">System</span>.out.<span class="f">println</span>(<span class="s">"Productor "</span> + name + <span class="s">" produce "</span> + produce);
            <span class="t">Buffer</span>.<span class="f">mostrarCola</span>();

            mutex.<span class="f">release</span>();  <span class="c">// Sale de exclusión mutua</span>
            vacio.<span class="f">release</span>();  <span class="c">// Avisa al consumidor que hay 1 elemento disponible</span>
        }
    }
}`)}

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(code).then(done, () => fallbackCopy(code, done));
        } else {
          fallbackCopy(code, done);
        }
        return;
      }

      const tab = e.target.closest(".tab");
      if (tab) {
        const box = tab.closest(".tabs");
        $$(":scope > .tab-heads > .tab", box).forEach((b) => b.classList.toggle("active", b === tab));
        $$(":scope > .tab-body", box).forEach((b) => b.classList.toggle("active", b.dataset.i === tab.dataset.i));
      }
    });

    function fallbackCopy(text, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (err) {}
      ta.remove();
    }

    /* ---------------- Menú móvil y buscador móvil ---------------- */
    $("#btn-menu").addEventListener("click", () => {
      $("#sidebar").classList.toggle("open");
      $("#overlay").classList.toggle("show");
    });
    $("#overlay").addEventListener("click", () => {
      $("#sidebar").classList.remove("open");
      $("#overlay").classList.remove("show");
    });

    const cajaBuscar = $("#caja-buscar");
    const btnBuscarMovil = $("#btn-buscar-movil");
    const btnCerrarBuscar = $("#cerrar-buscar");
    const input = $("#buscador"), box = $("#resultados");

    function toggleMobileSearch(open) {
      if (!cajaBuscar) return;
      cajaBuscar.classList.toggle("open", open);
      if (open) {
        input.focus();
        input.select();
      } else {
        input.value = "";
        box.hidden = true;
        input.blur();
      }
    }
    if (btnBuscarMovil) btnBuscarMovil.addEventListener("click", () => toggleMobileSearch(!cajaBuscar.classList.contains("open")));
    if (btnCerrarBuscar) btnCerrarBuscar.addEventListener("click", () => toggleMobileSearch(false));

    /* ---------------- Buscador instantáneo ---------------- */
    let index = null;
    function buildIndex() {
      const tmp = document.createElement("div");
      index = [];
      TEMAS.forEach((t) => t.secciones.forEach((s) => {
        tmp.innerHTML = s.html;
        index.push({ t, s, text: (s.titulo + " " + tmp.textContent).replace(/\s+/g, " ") });
      }));
    }
    const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    input.addEventListener("input", () => {
      const q = input.value.trim();
      if (q.length < 2) { box.hidden = true; return; }
      if (!index) buildIndex();
      const nq = norm(q);
      const res = index.filter((x) => norm(x.text).includes(nq)).slice(0, 20);
      box.innerHTML = res.length ? res.map((x, i) => {
        const pos = norm(x.text).indexOf(nq);
        const frag = x.text.slice(Math.max(0, pos - 38), pos + q.length + 62);
        const fpos = norm(frag).indexOf(nq);
        const snip = esc(frag.slice(0, fpos)) + "<mark>" + esc(frag.slice(fpos, fpos + q.length)) + "</mark>" + esc(frag.slice(fpos + q.length));
        const ic = SVG[x.t.icon] || SVG.sem;
        return `<a href="#/${x.t.id}/${x.s.id}" class="${i === 0 ? "sel" : ""}">
          <div class="sr-head">${ic}<span>${esc(x.s.titulo)}</span></div>
          <small>Bloque ${x.t.numero} (${esc(x.t.titulo)}) · …${snip}…</small>
        </a>`;
      }).join("") : `<a href="javascript:void(0)">Sin resultados para «${esc(q)}»</a>`;
      box.hidden = false;
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const a = $("a.sel", box);
        if (a && a.getAttribute("href") && a.getAttribute("href").startsWith("#")) {
          location.hash = a.getAttribute("href");
          box.hidden = true;
          input.blur();
        }
      }
      if (e.key === "Escape") { box.hidden = true; input.blur(); if (cajaBuscar) cajaBuscar.classList.remove("open"); }
    });
    box.addEventListener("click", () => { box.hidden = true; if (cajaBuscar) cajaBuscar.classList.remove("open"); });
    document.addEventListener("click", (e) => { if (!e.target.closest(".search")) box.hidden = true; });
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        input.focus();
        input.select();
      }
    });

    render();
  })();
  </script>
</body>
</html>
